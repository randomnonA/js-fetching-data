
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>
  /* global nn */
  /** In the demo, they provided a link to https://github.com/netizenorg/netnet-standard-library 
  which you can scroll down from and get the line of code that I put on the top **/

  async function setup () {
    // fetch data from the "Dog CEO" REST API
    const url = 'https://dog.ceo/api/breed/german/shepherd/images/random'
    const res = await fetch(url)
    const data = await res.json()
    // press F12 to open console (fn + F12 on mac)
    console.log(data)
    // create an <img> and add it to the pag
    nn.create('img') 
      .set('src', data.message)
      .css('width', 500)
      .addTo('body')
  }

  nn.on('load', setup)
  nn.on('click', setup)

</script>
